name: Auto-Update Dashboard with Live Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install axios cheerio
      
      - name: Fetch live data and update dashboard
        run: node update-dashboard.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html
          git commit -m "Auto-update: Dashboard refreshed with live WHO/CDC/ECDC data at $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push

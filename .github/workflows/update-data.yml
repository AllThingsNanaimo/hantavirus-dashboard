name: Auto-Update Dashboard with Live Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Update dashboard with live data
        run: |
          bash update-dashboard.sh
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Dashboard Bot"
          git add index.html
          git commit -m "Auto-update: Dashboard refreshed at $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
